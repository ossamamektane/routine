# Routine for Mac, iPhone and iPad. Made into an Xcode project by XcodeGen (the GitHub workflow does this).
# Before building, the workflow copies the site into apps/web and makes the icons from icon.png.
name: Routine
options:
  bundleIdPrefix: io.github.ossamamektane
  deploymentTarget:
    macOS: "12.0"
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: Routine
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Routine-Mac:
    type: application
    platform: macOS
    sources:
      - path: Shared
        excludes: ["*.js"]
      - path: Mac
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Info-Mac.plist
      properties:
        CFBundleName: Routine
        CFBundleDisplayName: Routine
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ossamamektane.routine
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
  Routine-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
        excludes: ["*.js"]
      - path: iOS
      - path: web
        type: folder
        buildPhase: resources
    info:
      path: Info-iOS.plist
      properties:
        CFBundleName: Routine
        CFBundleDisplayName: Routine
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ossamamektane.routine
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
