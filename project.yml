# Generates Routine.xcodeproj with XcodeGen (https://github.com/yonaskolb/XcodeGen).
# The GitHub workflow runs `xcodegen generate` for you, so the .xcodeproj is never committed.
name: Routine
options:
  bundleIdPrefix: com.ossamamektane
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Routine:
    type: application
    platform: iOS
    sources:
      - path: Routine
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
      - path: Routine/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Routine
        PRODUCT_BUNDLE_IDENTIFIER: com.ossamamektane.routine
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/Routine.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        ENABLE_PREVIEWS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  RoutineTests:
    type: bundle.unit-test
    platform: iOS
    # The scheduling engine is compiled straight into the tests, so they run without launching the app.
    sources:
      - path: RoutineTests
      - path: Routine/Model
      - path: Routine/Support
      - path: Routine/Store/LegacyImport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ossamamektane.routine.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Routine:
    build:
      targets:
        Routine: all
        RoutineTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RoutineTests
    archive:
      config: Release
