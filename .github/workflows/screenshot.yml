name: TestFlight
2
​
3
# Builds the native app and sends it to TestFlight.
4
# Run it from the Actions tab: TestFlight > Run workflow.
5
on:
6
  workflow_dispatch:
7
    inputs:
8
      version:
9
        description: "Version shown on the App Store (for example 1.0.0)"
10
        required: true
11
        default: "1.0.0"
12
​
13
concurrency:
14
  group: testflight
15
  cancel-in-progress: false
16
​
17
jobs:
18
  testflight:
19
    name: Build and upload
20
    runs-on: macos-26
21
    timeout-minutes: 60
22
    env:
23
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
24
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
25
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
26
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
27
      BUNDLE_ID: com.ossamamektane.routine
28
      VERSION: ${{ inputs.version }}
29
    steps:
30
      - name: Check out
31
        uses: actions/checkout@v4
32
​
33
      - name: Check settings
34
        run: |
35
          missing=""
36
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
37
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
38
          done
39
          if [ -n "$missing" ]; then
40
            echo "::error::These repository secrets are missing:$missing"
41
            exit 1
42
          fi
43
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
44
            echo "::error::The version must look like 1.0.0"
45
            exit 1
46
          fi
47
​
48
      - name: Use the newest Xcode
49
        uses: maxim-lobanov/setup-xcode@v1
50
        with:
51
          xcode-version: latest-stable
52
​
53
      # Apple asks for the newest iOS SDK (ITMS-90725). This Mac (macOS 26) has the newest Xcode
54
      # GitHub offers, and the step above picks it. This only warns if it's still older.
55
      - name: Check the iOS SDK
56
        run: |
57
          SDK="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)"
58
          echo "Using $(xcodebuild -version | head -1) with the iOS $SDK SDK"
59
          MAJOR="${SDK%%.*}"
60
          if [ -n "$MAJOR" ] && [ "$MAJOR" -lt 27 ] 2>/dev/null; then
61
            echo "::warning::Built with the iOS $SDK SDK. Apple needs the iOS 27 SDK (Xcode 27) from April 2027. Until then, uploads still work."
62
          fi
63
​
64
      - name: Create the Xcode project
65
        run: |
66
          brew install xcodegen
67
          xcodegen generate
68
​
69
      - name: Add the App Store Connect key
70
        run: |
71
          mkdir -p "$HOME/private_keys"
72
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
73
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
74
            printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEY_PATH"
75
          else
76
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
77
          fi
78
          chmod 600 "$KEY_PATH"
79
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
80
​
81
      - name: Build
82
        run: |
83
          set -o pipefail
84
          BUILD_NUMBER="$(date -u +%Y).$((10#$(date -u +%m%d))).$((10#$(date -u +%H%M)))"
85
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
86
          echo "Building Routine $VERSION ($BUILD_NUMBER) with $(xcodebuild -version | head -1)"
87
          xcodebuild archive \
88
            -quiet \
89
            -project Routine.xcodeproj \
90
            -scheme Routine \
91
            -configuration Release \
92
            -destination 'generic/platform=iOS' \
93
            -archivePath "$RUNNER_TEMP/Routine.xcarchive" \
94
            MARKETING_VERSION="$VERSION" \
95
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
96
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
97
            CODE_SIGNING_ALLOWED=NO \
98
            CODE_SIGNING_REQUIRED=NO \
99
            CODE_SIGN_IDENTITY=""
100
​
101
      - name: Add iCloud entitlement
102
        run: |
103
          APP="$RUNNER_TEMP/Routine.xcarchive/Products/Applications/Routine.app"
104
          if [ ! -d "$APP" ]; then
105
            echo "::error::The build did not produce Routine.app"
106
            exit 1
107
          fi
108
          ENTITLEMENTS="$RUNNER_TEMP/Routine.entitlements"
109
          cp Config/Routine.entitlements "$ENTITLEMENTS"
110
          /usr/libexec/PlistBuddy -c "Set :com.apple.developer.ubiquity-kvstore-identifier ${APPLE_TEAM_ID}.${BUNDLE_ID}" "$ENTITLEMENTS"
111
          codesign --force --sign - --timestamp=none --generate-entitlement-der --entitlements "$ENTITLEMENTS" "$APP"
112
          codesign -d --entitlements - "$APP"
113
​
114
      - name: Sign and upload to TestFlight
115
        run: |
116
          set -o pipefail
117
          sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
118
          xcodebuild -exportArchive \
119
            -archivePath "$RUNNER_TEMP/Routine.xcarchive" \
120
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
121
            -exportPath "$RUNNER_TEMP/export" \
122
            -allowProvisioningUpdates \
123
            -authenticationKeyPath "$ASC_KEY_PATH" \
124
            -authenticationKeyID "$ASC_KEY_ID" \
125
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
126
          {
127
            echo "### Routine $VERSION ($BUILD_NUMBER) was sent to App Store Connect"
128
            echo ""
129
            echo "It shows up in TestFlight once Apple finishes processing it, usually within 5 to 30 minutes."
130
          } >> "$GITHUB_STEP_SUMMARY"
131
​
132
      - name: Collect logs
133
        if: failure()
134
        run: |
135
          mkdir -p "$RUNNER_TEMP/logs"
136
          find "${TMPDIR:-/tmp}" -maxdepth 3 -name '*.xcdistributionlogs' -exec cp -R {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
137
          cp -R "$RUNNER_TEMP/export" "$RUNNER_TEMP/logs/" 2>/dev/null || true
138
​
139
      - name: Upload logs
140
        if: failure()
141
        uses: actions/upload-artifact@v4
142
        with:
143
          name: testflight-logs
144
          path: ${{ runner.temp }}/logs
145
          if-no-files-found: ignore
146
​
147
      - name: Remove the key
148
        if: always()
149
        run: rm -rf "$HOME/private_keys"
