3
# Opens Routine in an iPhone simulator on GitHub's Mac, taps through it and saves
4
# screenshots and two short videos, so you can see the app without a phone or TestFlight.
5
# No Apple keys or signing needed.
6
#
7
# Run it: Actions > Screenshots > Run workflow (takes about 15 minutes).
8
# Then open the finished run and download "Routine-screenshots" at the bottom of the page.
9
# The screenshot test only exists while this runs. Nothing is added to the app.
10
