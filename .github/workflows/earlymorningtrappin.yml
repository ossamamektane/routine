      - name: Take screenshots
613
        run: |
614
          SHOTS="$RUNNER_TEMP/screenshots"
615
          RESULTS="$RUNNER_TEMP/results"
616
          APP="$RUNNER_TEMP/build/Build/Products/Debug-iphonesimulator/Routine.app"
617
          DATA_FILE="Library/Application Support/Routine/data.json"
618
          mkdir -p "$SHOTS" "$RESULTS"
619
​
620
          remove_app() {
621
            xcrun simctl terminate "$SIM" "$BUNDLE_ID" 2>/dev/null || true
622
            xcrun simctl uninstall "$SIM" "$BUNDLE_ID" 2>/dev/null || true
623
          }
624
​
625
          # Fresh install with the demo routines and bills already saved.
626
          install_with_demo_data() {
627
            remove_app
628
            xcrun simctl install "$SIM" "$APP"
629
            CONTAINER=$(xcrun simctl get_app_container "$SIM" "$BUNDLE_ID" data)
630
            mkdir -p "$(dirname "$CONTAINER/$DATA_FILE")"
631
            python3 "$RUNNER_TEMP/demo_data.py" > "$CONTAINER/$DATA_FILE"
632
            echo "Demo data saved ($(wc -c < "$CONTAINER/$DATA_FILE") bytes)"
633
          }
634
​
635
          # $1 = test name, $2 = video file name (optional)
636
          run_test() {
637
            VIDEO_PID=""
638
            if [ -n "${2:-}" ]; then
639
              xcrun simctl io "$SIM" recordVideo --codec=h264 --force "$SHOTS/$2" > /dev/null 2>&1 &
640
              VIDEO_PID=$!
641
              sleep 3
642
            fi
643
            TEST_RUNNER_SHOTS_DIR="$SHOTS" xcodebuild test-without-building \
644
              -project Routine.xcodeproj \
645
              -scheme Screenshots \
646
              -destination "id=$SIM" \
647
              -derivedDataPath "$RUNNER_TEMP/build" \
648
              -resultBundlePath "$RESULTS/$1.xcresult" \
649
              -only-testing:"RoutineUITests/ScreenshotTests/$1" \
650
              > "$RESULTS/$1.log" 2>&1 \
651
              || echo "::warning::Some steps in $1 didn't work. The screenshots it took are still saved."
652
            grep -E "SCREENSHOT|Test Case|error:" "$RESULTS/$1.log" | head -80 || true
653
            if [ -n "$VIDEO_PID" ]; then
654
              kill -INT "$VIDEO_PID" 2>/dev/null || true
655
              for _ in $(seq 1 20); do
656
                kill -0 "$VIDEO_PID" 2>/dev/null || break
657
                sleep 1
658
              done
659
              kill -9 "$VIDEO_PID" 2>/dev/null || true
660
            fi
661
          }
662
​
663
          remove_app
664
          run_test test1FirstLaunch video-1-first-launch.mp4
665
​
666
          install_with_demo_data
667
          run_test test2Tour video-2-tour.mp4
668
​
669
          xcrun simctl ui "$SIM" appearance dark || true
670
          install_with_demo_data
671
          run_test test3DarkMode
672
​
673
          # Backup: if the test couldn't write the files, copy them out of the test results.
674
          if ! ls "$SHOTS"/*.png > /dev/null 2>&1; then
675
            echo "::warning::Copying the screenshots from the test results instead."
676
            for result in "$RESULTS"/*.xcresult; do
677
              xcrun xcresulttool export attachments --path "$result" \
678
                --output-path "$SHOTS/$(basename "$result" .xcresult)" || true
679
            done
680
          fi
681
​
682
          echo "Saved:"
683
          ls -1 "$SHOTS"
