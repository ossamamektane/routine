              /// Saves the screen as SHOTS_DIR/name.png and also attaches it to the test results.
352
              @MainActor
353
              private func shot(_ name: String) {
354
                  pause()
355
                  let screenshot = XCUIScreen.main.screenshot()
356
                  let attachment = XCTAttachment(screenshot: screenshot)
357
                  attachment.name = name
358
                  attachment.lifetime = .keepAlways
359
                  add(attachment)
360
                  guard let folder = outputFolder else { return }
361
                  do {
362
                      try screenshot.pngRepresentation.write(to: folder.appendingPathComponent(name + ".png"))
363
                      print("SCREENSHOT saved \(name).png")
364
                  } catch {
365
                      print("SCREENSHOT could not save \(name).png: \(error)")
366
                  }
367
              }
368
​
369
              /// Something that didn't go as planned. Collected in notes.txt.
370
              private func note(_ text: String) {
371
                  print("SCREENSHOT NOTE: \(text)")
372
                  guard let folder = outputFolder else { return }
373
                  let url = folder.appendingPathComponent("notes.txt")
374
                  let old = (try? String(contentsOf: url, encoding: .utf8)) ?? ""
375
                  try? (old + text + "\n").write(to: url, atomically: true, encoding: .utf8)
376
              }
377
​
378
              private var outputFolder: URL? {
379
                  guard let path = ProcessInfo.processInfo.environment["SHOTS_DIR"], !path.isEmpty else { return nil }
380
                  let url = URL(fileURLWithPath: path, isDirectory: true)
381
                  try? FileManager.default.createDirectory(at: url, withIntermediateDirectories: true)
382
                  return url
383
              }
