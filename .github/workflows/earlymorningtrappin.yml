      - name: Start an iPhone simulator
564
        run: |
565
          cat > "$RUNNER_TEMP/pick.py" <<'PY'
566
          import json, re, sys
567
          devices = json.load(open(sys.argv[1]))["devices"]
568
          sdk = tuple(int(n) for n in re.findall(r"\d+", sys.argv[2] if len(sys.argv) > 2 else ""))[:2]
569
          best = None
570
          for runtime, entries in devices.items():
571
              if ".iOS-" not in runtime:
572
                  continue
573
              version = tuple(int(n) for n in re.findall(r"\d+", runtime.split(".iOS-")[-1]))
574
              for d in entries:
575
                  name = d.get("name", "")
576
                  if not d.get("isAvailable", True) or not name.startswith("iPhone"):
577
                      continue
578
                  # An iOS this Xcode supports first (a newer beta one may not run), then the
579
                  # newest iOS, then the big Pro Max screen that App Store Connect asks for.
580
                  supported = not sdk or version[:2] <= sdk
581
                  rank = (supported, version, "Pro Max" in name, name)
582
                  if best is None or rank > best[0]:
583
                      best = (rank, d["udid"], name)
584
          if best:
585
              print(best[1])
586
              print("Using " + best[2] + " with iOS " + ".".join(str(n) for n in best[0][1]), file=sys.stderr)
587
          PY
588
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
589
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || true)
590
          echo "$(xcodebuild -version | head -1), iOS Simulator SDK $SDK"
591
          SIM=$(python3 "$RUNNER_TEMP/pick.py" "$RUNNER_TEMP/devices.json" "$SDK")
592
          if [ -z "$SIM" ]; then
593
            echo "::error::No iPhone simulator found"
594
            exit 1
595
          fi
596
          echo "SIM=$SIM" >> "$GITHUB_ENV"
597
          xcrun simctl bootstatus "$SIM" -b
598
          # A tidy status bar: 9:41, full battery and signal.
599
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 \
600
            --cellularMode active --cellularBars 4 --dataNetwork wifi --wifiMode active --wifiBars 3 || true
601
          xcrun simctl ui "$SIM" appearance light || true
602
