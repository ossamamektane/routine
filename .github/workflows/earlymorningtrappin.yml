              @MainActor
342
              private func scrollUntilVisible(_ element: XCUIElement, in app: XCUIApplication) {
343
                  var swipes = 0
344
                  while swipes < 4 && !(element.exists && element.isHittable) {
345
                      app.swipeUp()
346
                      swipes += 1
347
                      pause(0.5)
348
                  }
349
              }
