              /// Types into a text field. Uses `fallback` if the field can't be found by its name.
311
              @MainActor
312
              private func enter(_ text: String, into field: XCUIElement, or fallback: XCUIElement) {
313
                  let target: XCUIElement
314
                  if field.waitForExistence(timeout: 5) {
315
                      target = field
316
                  } else if fallback.exists {
317
                      target = fallback
318
                  } else {
319
                      note("Couldn't find a text field to type \(text).")
320
                      return
321
                  }
322
                  target.tap()
323
                  pause(0.5)
324
                  target.typeText(text)
325
                  pause(0.5)
326
              }
